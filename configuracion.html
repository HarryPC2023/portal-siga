<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - SIGA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/perfil-siga.css">
    <link rel="stylesheet" href="css/auth-siga.css?v=8">
</head>

<body>

    {% include nav.html activo="" %}

    <section class="dash-hero">
        <div class="dash-wrap">
            <h1 class="dash-hero-titulo"><span class="titulo-pildora">CONFIGURACIÓN</span></h1>
            <p style="max-width:none; white-space:nowrap;">Ajustes de tu cuenta de acceso a SIGA.</p>
        </div>
    </section>

    <section class="dash-detalle" style="padding-top:30px; max-width:520px;">
        <div class="modal-perfil-caja" style="width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.08);">
            <h2>Cambiar contraseña</h2>
            <p class="intro">Solo aplica si iniciaste sesión con correo y contraseña. Si entraste con Google, tu
                contraseña se administra desde tu cuenta de Google.</p>

            <form id="formCambiarContrasena" class="form-perfil">
                <label>Nueva contraseña
                    <div class="campo-contrasena">
                        <input type="password" name="nueva" minlength="6" required>
                        <button type="button" class="btn-ojo" aria-label="Mostrar contraseña">👁</button>
                    </div>
                </label>
                <label>Repite la nueva contraseña
                    <div class="campo-contrasena">
                        <input type="password" name="confirmar" minlength="6" required>
                        <button type="button" class="btn-ojo" aria-label="Mostrar contraseña">👁</button>
                    </div>
                </label>
                <button type="submit" class="btn-primary" style="width:100%; justify-content:center;">Actualizar
                    contraseña</button>
                <p class="perfil-msg" id="configMsg"></p>
            </form>
        </div>
    </section>

    <a href="#" class="volver-arriba" id="volverArriba" aria-label="Volver arriba">↑</a>

    <script src="js/landing.js"></script>
    <script type="module" src="js/configuracion-siga.js?v=8"></script>
</body>

</html>

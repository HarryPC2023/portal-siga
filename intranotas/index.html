<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranotas - SIGA</title>

    <meta name="description" content="Simulador de Promedio Académico - Universidad Nacional de Ingeniería">
    <meta name="theme-color" content="#FFFDF9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="INTRANOTAS">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="stylesheet" href="css/intranotas.css">
    <link rel="stylesheet" href="css/siga-theme-intranotas.css">
</head>

<body>

    {% include nav.html activo="intranotas" %}

    <div class="contenedor-tema" id="contenedor-tema" style="display:none;">
        <button class="btn-tema-trigger" onclick="toggleDropdownTema()">
            <span class="tema-icono" id="tema-icono-activo">☀️</span>
            <span id="tema-label-activo">Light</span>
            <span class="tema-flecha">▼</span>
        </button>
        <div class="tema-dropdown">
            <button class="tema-opcion activo" data-tema="light" onclick="seleccionarTema('light')">
                <span class="opcion-icono">☀️</span> Light
            </button>
            <button class="tema-opcion" data-tema="dark" onclick="seleccionarTema('dark')">
                <span class="opcion-icono">🌙</span> Dark
            </button>
            <button class="tema-opcion" data-tema="ocean" onclick="seleccionarTema('ocean')">
                <span class="opcion-icono">🌊</span> Ocean
            </button>
            <button class="tema-opcion" data-tema="forest" onclick="seleccionarTema('forest')">
                <span class="opcion-icono">🌿</span> Forest
            </button>
        </div>
    </div>

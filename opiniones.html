<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opiniones de profesores - SIGA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/dashboard.css">

<body>

  {% include nav.html activo="opiniones" %}

  <section class="dash-hero">

  </section>

  <section class="dash-detalle" style="padding-top:30px; max-width:1160px;">

    <div class="opiniones-filtros" id="opinionesFiltros">

        <option value="software">Software</option>
      </select>
      <select id="filtroCiclo"></select>

    <div class="opiniones-grid" id="opinionesGrid"></div>

name: Deploy SIGA a GitHub Pages

on:
  push:
    branches: ["main"]
  # Permite lanzarlo a mano desde la pestaña "Actions" de GitHub, sin
  # necesidad de un push, útil para reintentar si algo falla.
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos despliegues corran a la vez si haces varios push seguidos;
# el más nuevo espera a que termine el anterior en vez de pisarlo.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      # Tu Gemfile pide Jekyll directo (no la gema "github-pages", que trae
      # una versión vieja fija e incompatible con la 4.4 que usas). Por eso
      # se instala con tu Gemfile.lock tal cual, reproduciendo exactamente
      # tu build de hoy. El --add-platform es necesario porque tu
      # Gemfile.lock se generó en Windows (x64-mingw-ucrt) y este runner
      # es Linux — sin esto, bundler no encuentra binarios compatibles.
      - name: Instalar dependencias de Ruby
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install

      - name: Compilar el sitio con Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Aquí se inyecta ?v=<hash-del-commit> en todo el CSS/JS del sitio
      # ya compilado — HTML, imports de módulos ES dentro de .js, y los
      # imports inline dentro de <script type="module"> en el HTML.
      - name: Inyectar versión de caché en CSS/JS
        run: |
          python3 scripts/inyectar_version.py ./_site "${GITHUB_SHA::7}"

      - name: Subir el sitio compilado como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
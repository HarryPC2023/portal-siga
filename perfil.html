<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil - SIGA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/perfil-siga.css">
</head>

<body>

    {% include nav.html activo="" %}

    <section class="dash-hero">
        <div class="dash-wrap">
            <h1 class="dash-hero-titulo"><span class="titulo-pildora">MI PERFIL</span></h1>
            <p style="max-width:none; white-space:nowrap;">Tu identidad académica dentro de SIGA — distinta de la cuenta
                con la que iniciaste sesión.</p>
        </div>
    </section>

    <section class="dash-detalle" style="padding-top:30px; max-width:520px;">
        <div class="modal-perfil-caja" style="width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.08);">
            <form id="formPerfil" class="form-perfil">
                <div style="position:relative; width:88px; margin:0 auto 6px;">
                    <img id="previewFoto" src="" alt="Foto de perfil"
                        style="width:88px; height:88px; border-radius:50%; object-fit:cover; background:var(--brand-azul-tinte); display:none;">
                    <div id="previewFotoVacia"
                        style="width:88px; height:88px; border-radius:50%; background:var(--brand-azul-tinte); display:flex; align-items:center; justify-content:center; font-size:32px; color:var(--brand-morado);">
                        👤</div>
                    <button type="button" id="btnCamara" aria-label="Cambiar foto de perfil"
                        style="position:absolute; bottom:-2px; right:-2px; width:32px; height:32px; border-radius:50%; background:var(--brand-morado); border:3px solid #fff; color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;">📷</button>
                    <input type="file" name="foto" id="inputFoto" accept="image/*" hidden>
                </div>
                <label>Nombre completo
                    <input type="text" name="nombre" placeholder="Tu nombre y apellido" required>
                </label>
                <label>Código de estudiante
                    <input type="text" name="codigo_estudiante" placeholder="Ej. 20231059E" required>
                </label>
                <label>Carrera
                    <select name="carrera" required>
                        <option value="" disabled>Selecciona tu carrera</option>
                        <option value="sistemas">Ingeniería de Sistemas</option>
                        <option value="industrial">Ingeniería Industrial</option>
                        <option value="software">Ingeniería de Software</option>
                    </select>
                </label>
                <label>Periodo académico actual
                    <select name="periodo_actual" id="selectorPeriodoPerfil"></select>
                </label>
                <button type="submit" class="btn-primary" style="width:100%; justify-content:center;">Guardar
                    cambios</button>
                <p class="perfil-msg" id="perfilMsg"></p>
            </form>
        </div>
    </section>

    <a href="#" class="volver-arriba" id="volverArriba" aria-label="Volver arriba">↑</a>

    <script src="js/landing.js"></script>
    <script type="module" src="js/perfil-editar.js?v=6"></script>
</body>

</html>

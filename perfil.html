<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta - SIGA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    {% include tema-anti-flash.html %}
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/tema-siga.css?v=1">
    <link rel="stylesheet" href="css/auth-siga.css?v=8">
    <link rel="stylesheet" href="css/perfil-hub.css?v=2">
    <link rel="stylesheet" href="css/carnet-siga.css">
    <link rel="stylesheet" href="css/mi-cuenta.css">
    <link rel="icon" href="/portal-siga/icons/siga_web.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="/portal-siga/icons/siga_escritorio.png">
    <link rel="apple-touch-icon" href="/portal-siga/icons/siga_apple.png">
    <link rel="manifest" href="/portal-siga/manifest.json">
    <meta name="theme-color" content="#000000">
</head>

<body>

    {% include nav.html activo="" %}

    <section class="dash-hero">
        <div class="dash-wrap">
            <h1 class="dash-hero-titulo"><span class="titulo-pildora">MI CUENTA</span></h1>
            <p style="max-width:none; white-space:nowrap;">Tu identidad académica, tu cuenta y tus preferencias dentro
                de SIGA.</p>
        </div>
    </section>

    <section class="perfil-hub">
        <!-- Pestañas en píldoras (sep 2026): mismos nombres, íconos y colores que
             el menú de usuario (js/menu-usuario.js). Los data-tab / #hash no cambian. -->
        <nav class="perfil-hub-nav perfil-hub-pildoras" id="perfilHubNav" aria-label="Secciones de mi cuenta">
            <button type="button" class="perfil-hub-tab" data-tab="info"
                style="--tab-acento:#3C7CF8;--tab-fondo:#EEF3FF">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2.5" />
                    <circle cx="9" cy="11" r="2" />
                    <path d="M6.5 16c.6-1.4 1.5-2 2.5-2s1.9.6 2.5 2M14 10h4M14 13.5h3" />
                </svg>
                <span>Mi carnet</span>
            </button>
            <button type="button" class="perfil-hub-tab" data-tab="preferencias"
                style="--tab-acento:#E0A100;--tab-fondo:#FFF6DD">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8" />
                    <path d="M10 20a2 2 0 0 0 4 0" />
                </svg>
                <span>Avisos</span>
            </button>
            <button type="button" class="perfil-hub-tab" data-tab="faq"
                style="--tab-acento:#0FA89E;--tab-fondo:#E6F7F4">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" />
                    <path d="M9.6 9.6a2.5 2.5 0 0 1 4.8 1c0 1.6-2.4 2-2.4 3.4M12 17h.01" />
                </svg>
                <span>Ayuda</span>
            </button>
            <button type="button" class="perfil-hub-tab" data-tab="sugerencias"
                style="--tab-acento:#C13F94;--tab-fondo:#FDEAF3">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 18h6M10 21h4" />
                    <path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" />
                </svg>
                <span>Ideas</span>
            </button>
            <button type="button" class="perfil-hub-tab" data-tab="cuenta"
                style="--tab-acento:#6600CC;--tab-fondo:#F3EAFB">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3l7 3v5c0 5-3.4 8.4-7 10-3.6-1.6-7-5-7-10V6z" />
                    <path d="M9.5 12l1.8 1.8L15 10" />
                </svg>
                <span>Seguridad</span>
            </button>
        </nav>

        <div class="perfil-hub-panel">

            <!-- ===== INFORMACIÓN GENERAL: CARNET SIGA (rediseño sep 2026) ===== -->
            <div class="perfil-panel" data-panel="info">
                <div class="mi-carnet" id="miCarnet">
                    <div class="mi-carnet-hero">
                        <div class="mi-carnet-lugar" id="carnetMiCuenta"></div>
                        <div class="mi-carnet-estado">
                            <h2 id="carnetEstadoTitulo">Cargando tu carnet…</h2>
                            <p id="carnetEstadoTexto"></p>
                            <div class="mi-carnet-piezas" id="carnetPiezas" aria-hidden="true"><i></i><i></i><i></i>
                            </div>
                        </div>
                    </div>
                    <div class="mi-carnet-tarjetas" id="carnetTarjetas"></div>
                    <input type="file" id="inputFoto" accept="image/*" hidden>
                </div>
            </div>

            <!-- ===== SEGURIDAD (antes Cuenta) — contenido en js/seguridad.js ===== -->
            <div class="perfil-panel" data-panel="cuenta" hidden>
                <div class="seguridad" id="seguridad"></div>
            </div>

            <!-- ===== AVISOS (antes Preferencias) — contenido en js/avisos.js ===== -->
            <div class="perfil-panel" data-panel="preferencias" hidden>
                <div class="avisos" id="avisos"></div>
            </div>

            <!-- ===== PREGUNTAS FRECUENTES ===== -->
            <!-- ===== AYUDA (antes Preguntas Frecuentes) — contenido en js/ayuda.js ===== -->
            <div class="perfil-panel" data-panel="faq" hidden>
                <div class="ayuda" id="ayuda"></div>
            </div>

            <!-- ===== IDEAS (antes Sugerencias) — contenido en js/ideas.js ===== -->
            <div class="perfil-panel" data-panel="sugerencias" hidden>
                <div class="ideas" id="ideas"></div>
            </div>
        </div>
    </section>

    <a href="#" class="volver-arriba" id="volverArriba" aria-label="Volver arriba">↑</a>

    <script src="js/landing.js"></script>
    <script src="js/tema-siga.js?v=1"></script>
    <script type="module" src="js/perfil-hub.js?v=2"></script>
</body>

</html>

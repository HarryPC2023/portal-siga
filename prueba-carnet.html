<!DOCTYPE html>
<html lang="es">
<!-- PÁGINA TEMPORAL de prueba del carnet (paso 2 del rediseño de Perfil).
     No está enlazada en el menú y NO guarda nada en Supabase.
     Se borra en el paso de limpieza. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba · Carnet SIGA</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/tema-siga.css">
    <link rel="stylesheet" href="css/carnet-siga.css">
    <style>
        body { margin: 0; font-family: var(--font-body); background: linear-gradient(120deg, #dcf6f6, #f0e4fb); color: var(--ink); }
        main { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; }
        h1, h2 { font-family: var(--font-heading); }
        h2 { font-size: 16px; margin: 34px 0 12px; }
        .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
        .rejilla small { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
        .demo { display: grid; grid-template-columns: minmax(260px, 380px) minmax(260px, 340px); gap: 22px; align-items: start; }
        @media (max-width: 700px) { .demo { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <h1>Prueba del carnet</h1>

    <h2>Interactivo (guardado simulado, no toca Supabase)</h2>
    <div class="demo">
        <div id="demoCarnet"></div>
        <div id="demoTarjeta"></div>
    </div>

    <h2>Las tres fases</h2>
    <div class="rejilla" id="fases"></div>

    <h2>Las 11 facultades (carnet completo)</h2>
    <div class="rejilla" id="facultades"></div>
</main>

<script type="module">
    import { FACULTADES } from './intranotas/facultades-datos.js';
    import {
        pintarCarnet, crearTarjetaPregunta, piezasFaltantes,
        normalizarCodigo, codigoValido, buscarCarrera,
    } from './js/carnet-siga.js';

    function casilla(contenedor, titulo, perfil) {
        const caja = document.createElement('div');
        const rotulo = document.createElement('small');
        rotulo.textContent = titulo;
        const lugar = document.createElement('div');
        caja.append(rotulo, lugar);
        contenedor.append(caja);
        pintarCarnet(lugar, perfil);
    }

    const fases = document.getElementById('fases');
    casilla(fases, 'Inicial', {});
    casilla(fases, 'Intermedia (sin carrera)', { codigo_estudiante: '20231059E' });
    casilla(fases, 'Completa', { codigo_estudiante: '20231059E', nombre: 'Harry', carrera: 'sistemas' });

    const facs = document.getElementById('facultades');
    for (const f of FACULTADES) {
        const c = f.carreras[0];
        casilla(facs, `${f.sigla} · ${c.nombre}`, { codigo_estudiante: '20240123K', nombre: 'Alumna Demo', carrera: c.id });
    }

    // Demo interactiva: mismas reglas que guardarPieza(), pero en memoria.
    const perfil = {};
    const COL = { codigo: 'codigo_estudiante', nombre: 'nombre', carrera: 'carrera' };
    async function guardarSimulado(pieza, valor) {
        await new Promise((r) => setTimeout(r, 400));
        if (pieza === 'codigo') {
            const cod = normalizarCodigo(valor);
            if (!codigoValido(cod)) return { ok: false, mensaje: 'Son 8 números y una letra, como 20231059E.' };
            return { ok: true, cambios: { codigo_estudiante: cod } };
        }
        if (pieza === 'nombre') {
            const n = (valor || '').trim();
            if (n.length < 2) return { ok: false, mensaje: 'Escribe al menos 2 letras.' };
            return { ok: true, cambios: { nombre: n } };
        }
        if (!buscarCarrera(valor)) return { ok: false, mensaje: 'Elige tu carrera de la lista.' };
        return { ok: true, cambios: { carrera: valor } };
    }

    function siguiente() {
        const carnet = pintarCarnet(document.getElementById('demoCarnet'), perfil);
        const lugar = document.getElementById('demoTarjeta');
        const pieza = piezasFaltantes(perfil)[0];
        if (!pieza) { lugar.textContent = '¡Carnet completo! 🎉'; return carnet; }
        lugar.replaceChildren(crearTarjetaPregunta(pieza, {
            textoCancelar: 'Ahora no',
            guardar: guardarSimulado,
            alGuardar: (cambios) => {
                Object.assign(perfil, cambios);
                siguiente().classList.add('carnet-latido');
            },
            alCancelar: () => { lugar.textContent = 'Listo, te lo recordamos otro día.'; },
        }));
        return carnet;
    }
    siguiente();
</script>
</body>
</html>
